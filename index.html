<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
    
    <form action=“#” method=“post”>
        <label for=“ full name”>Full Name:</label>
        <input type=“text” name=“ full name” id=“full name” required>
        <br> <br>
        <label for=“email”>Email:</label>
        <input type=“email” name=“email” id=“email” required>
        <br><br>
        <label for=“Password”>Pass:</label>
        <input type=“password” name=“password” id=“password” required>
        <br><br>
        <label for=“age”>Age:</label>
        <input type=“age” name=“age” id=“age” required>
        <br><br>
         <label for=“dob”>Date of Birth:</label><br>
        <input type=“date” id=“dob” name=“dob”>
       <br><br>
       Gender:
        <input type="radio" name="Gender" value="Male">Male
        <input type="radio" name="Gender" value="Female">Female
        <input type="radio" name="Gender" value="Other">Other
         <br> <br>
         
        <label>Gender:</label><br>
 
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
 
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
 
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
 
        <br><br>
 
        <label for="city">City:</label><br>
        <select id="city" name="city">
            <option value="dhaka">Dhaka</option>
            <option value="khulna">Khulna</option>
            <option value="rajshahi">Rajshahi</option>
            <option value="sylhet">Sylhet</option>
        </select>
 
        <br><br>
 
        <label>Hobbies:</label><br>
 
        <input type="checkbox" id="reading" name="hobby" value="reading">
        <label for="reading">Reading</label>
 
        <input type="checkbox" id="cricket" name="hobby" value="cricket">
        <label for="cricket">Cricket</label>
        <input type="music" id="music" name="hobby" value="music">
        <label for="music">Music</label>
         <br><br>
 
        <label for="about">About Yourself:</label><br>
        <textarea id="about" name="about" rows="4" cols="40"></textarea>
 
        <br><br>
 
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
 </fieldset>

 
 
    </form>
</body>
</html>
